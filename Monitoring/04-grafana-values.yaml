# ============================================================
# 04-grafana-values.yaml
#
# Grafana configuration for EKS
#
# Purpose:
#   - Persistent Grafana storage
#   - Admin credentials from Kubernetes Secret
#   - Prometheus datasource
#   - Loki datasource
#   - Production-style resource limits
#   - ClusterIP service
#   - Security hardening
#
# Grafana is intentionally deployed separately from
# kube-prometheus-stack.
# ============================================================


# ============================================================
# Image
# ============================================================

image:
  repository: grafana/grafana
  pullPolicy: IfNotPresent


# ============================================================
# Admin credentials
#
# IMPORTANT:
# Do NOT put the password directly in this file.
#
# deploy.ps1 will create:
#
#   grafana-admin-secret
#
# containing:
#
#   admin-user
#   admin-password
# ============================================================

admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password


# ============================================================
# Persistence
#
# Grafana stores:
#   - dashboards
#   - datasource configuration
#   - users
#   - organizations
#   - plugins
#   - SQLite database
#
# Use EBS CSI StorageClass.
# ============================================================

persistence:

  enabled: true

  type: pvc

  storageClassName: ebs-sc

  accessModes:
    - ReadWriteOnce

  size: 10Gi

  finalizers:
    - kubernetes.io/pvc-protection


# ============================================================
# Service
#
# Keep Grafana internal to the cluster.
#
# External access can later be provided through an
# AWS ALB Ingress with HTTPS.
# ============================================================
# ============================================================
# Ingress
# ============================================================

ingress:

  enabled: true

  ingressClassName: alb

  annotations:

    alb.ingress.kubernetes.io/scheme: internet-facing

    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'

    alb.ingress.kubernetes.io/ssl-redirect: "443"

    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:925181413092:certificate/6b1538c4-40c2-4041-b356-cf4765c583ba

  hosts:

    - grafana.akashdev.cloud


service:

  type: ClusterIP

  port: 80

  targetPort: 3000


# ============================================================
# Resources
# ============================================================

resources:

  requests:
    cpu: 100m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi


# ============================================================
# Security Context
# ============================================================

securityContext:

  runAsUser: 472

  runAsGroup: 472

  fsGroup: 472

  runAsNonRoot: true


containerSecurityContext:

  allowPrivilegeEscalation: false

  capabilities:
    drop:
      - ALL

  seccompProfile:
    type: RuntimeDefault


# ============================================================
# Grafana configuration
# ============================================================

grafana.ini:

  server:

    # Grafana listens on port 3000 inside the container.
    http_port: 3000

    # Important when Grafana is placed behind an ALB/Ingress.
    domain: grafana.akashdev.cloud

    root_url: "%(protocol)s://%(domain)s/"

    serve_from_sub_path: false


  # ----------------------------------------------------------
  # Security
  # ----------------------------------------------------------

  security:

    disable_gravatar: true

    cookie_secure: true

    cookie_samesite: lax

    strict_transport_security: true

    strict_transport_security_max_age_seconds: 31536000

    strict_transport_security_preload: true

    strict_transport_security_subdomains: true


  # ----------------------------------------------------------
  # Users
  # ----------------------------------------------------------

  users:

    allow_sign_up: false

    allow_org_create: false

    viewers_can_edit: false


  # ----------------------------------------------------------
  # Anonymous access
  # ----------------------------------------------------------

  auth.anonymous:

    enabled: false


# ============================================================
# Plugins
# ============================================================




# ============================================================
# Datasources
#
# Grafana will automatically have:
#
#   Prometheus
#   Loki
#
# available.
#
# The service names below depend on the Helm release names.
# We will verify them after installation.
# ============================================================

datasources:

  datasources.yaml:

    apiVersion: 1

    datasources:

      # ------------------------------------------------------
      # Prometheus
      # ------------------------------------------------------

      - name: Prometheus

        type: prometheus

        access: proxy

        url: http://prometheus-kube-prometheus-prometheus:9090

        isDefault: true

        editable: false

        jsonData:

          httpMethod: POST

          timeInterval: 30s


      # ------------------------------------------------------
      # Loki
      # ------------------------------------------------------

      - name: Loki

        type: loki

        access: proxy

        url: http://loki-gateway

        editable: false

        jsonData:

          maxLines: 1000


# ============================================================
# Dashboard provisioning
# ============================================================

dashboardProviders:

  dashboardproviders.yaml:

    apiVersion: 1

    providers:

      - name: default

        orgId: 1

        folder: ""

        type: file

        disableDeletion: false

        editable: true

        options:

          path: /var/lib/grafana/dashboards/default


# ============================================================
# Dashboard sidecar
#
# Allows Kubernetes ConfigMaps containing Grafana dashboards
# to be automatically discovered.
# ============================================================

sidecar:

  dashboards:

    enabled: true

    label: grafana_dashboard

    labelValue: "1"

    searchNamespace: ALL

    folder: /tmp/dashboards

    provider:

      allowUiUpdates: false

      foldersFromFilesStructure: true


# ============================================================
# ServiceMonitor
#
# Allows Prometheus to monitor Grafana itself.
# ============================================================

serviceMonitor:

  enabled: true

  labels:

    release: prometheus


# ============================================================
# Readiness / Liveness
# ============================================================

readinessProbe:

  httpGet:
    path: /api/health
    port: 3000

  initialDelaySeconds: 30

  timeoutSeconds: 5

  periodSeconds: 10

  failureThreshold: 6


livenessProbe:

  httpGet:
    path: /api/health
    port: 3000

  initialDelaySeconds: 60

  timeoutSeconds: 5

  periodSeconds: 10

  failureThreshold: 6