# Production CD Pipeline

name: Production CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - k8-manifests/prod/app-deployment.yaml
      - .github/workflows/prod-cd.yaml

permissions:
  contents: write
  id-token: write

jobs:

  # ==========================================================
  # JOB 1: Promote QA image to PROD
  # ==========================================================
  promote-image-to-prod:
    name: Pull QA Latest and Retag for Prod
    runs-on: ubuntu-latest

    env:
      QA_IMAGE: akashodedara/devsecops:latest
      PROD_IMAGE: akashodedara/devsecops:prod-${{ github.sha }}

    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull QA latest image
        run: |
          docker pull "${QA_IMAGE}"

      - name: Retag image for production
        run: |
          docker tag "${QA_IMAGE}" "${PROD_IMAGE}"

      - name: Push production image
        run: |
          docker push "${PROD_IMAGE}"


  # ==========================================================
  # JOB 2: Update PROD Kubernetes manifest
  # ==========================================================
  update-prod-manifest:
    name: Update Prod Manifest
    needs: promote-image-to-prod
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update image tag in prod manifest
        run: |
          sed -i "s|image: akashodedara/devsecops:.*|image: akashodedara/devsecops:prod-${GITHUB_SHA}|g" \
            k8-manifests/prod/app-deployment.yaml

      - name: Show updated manifest
        run: |
          cat k8-manifests/prod/app-deployment.yaml

      - name: Commit and push updated prod manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8-manifests/prod/app-deployment.yaml

          git commit \
            -m "Update prod image to prod-${GITHUB_SHA} [skip ci]" \
            || echo "No changes to commit"

          git push origin main


  # ==========================================================
  # JOB 3: Deploy PROD to EKS
  # ==========================================================
  deploy-to-k8s:
    name: Deploy to Production Kubernetes
    needs: update-prod-manifest
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: my-cluster
      K8S_NAMESPACE: prod

    steps:

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      # ------------------------------------------------------
      # Verify the secret contains the correct PROD role ARN
      # ------------------------------------------------------
      - name: Verify PROD role secret
        env:
          PROD_ROLE_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME1 }}
        run: |
          EXPECTED_ROLE_ARN="arn:aws:iam::925181413092:role/GitHubActionsEKSDeployRolePROD"

          if [ "$PROD_ROLE_ARN" != "$EXPECTED_ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_TO_ASSUME1 is NOT configured with the PROD role ARN."
            exit 1
          fi

          echo "AWS_ROLE_TO_ASSUME1 is correctly configured for the PROD role."

      # ------------------------------------------------------
      # Debug GitHub Actions context
      # ------------------------------------------------------
      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "Ref name: ${GITHUB_REF_NAME}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Workflow ref: ${GITHUB_WORKFLOW_REF}"



          echo "SHA: ${GITHUB_SHA}"   
          
      - name: Inspect GitHub OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)

          echo "===== GitHub OIDC Claims ====="
          echo "$PAYLOAD" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            ref,
            ref_type,
            workflow,
            workflow_ref,
            event_name
          }'
          echo "=============================="     

          echo "SHA: ${GITHUB_SHA}"    

         



      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::925181413092:role/GitHubActionsEKSDeployRolePROD
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # Setup kubectl
      # ------------------------------------------------------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # ------------------------------------------------------
      # Generate EKS kubeconfig
      # ------------------------------------------------------
      - name: Generate kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      # ------------------------------------------------------
      # Verify AWS identity
      # ------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # Verify Kubernetes context
      # ------------------------------------------------------
      - name: Verify Kubernetes context
        run: |
          kubectl config current-context

      # ------------------------------------------------------
      # Verify PROD namespace access
      # ------------------------------------------------------
      - name: Verify PROD namespace access
        run: |
          kubectl get pods -n "${K8S_NAMESPACE}"
          kubectl get services -n "${K8S_NAMESPACE}"

          kubectl auth can-i create deployments \
            -n "${K8S_NAMESPACE}"

          kubectl auth can-i create services \
            -n "${K8S_NAMESPACE}"

          kubectl auth can-i create ingresses.networking.k8s.io \
            -n "${K8S_NAMESPACE}"

      # ------------------------------------------------------
      # Deploy PROD manifests
      # ------------------------------------------------------
      - name: Deploy PROD manifests
        run: |
          kubectl apply \
            -f k8-manifests/prod/ \
            -n "${K8S_NAMESPACE}"

      # ------------------------------------------------------
      # Verify application rollout
      # ------------------------------------------------------
      - name: Verify rollout
        run: |
          kubectl rollout status \
            deployment/nodejs-app \
            -n "${K8S_NAMESPACE}" \
            --timeout=180s
